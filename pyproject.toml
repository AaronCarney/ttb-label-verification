[project]
name = "ttb-label-prototype"
version = "0.1.0"
description = "TTB AI-powered alcohol label verification prototype."
requires-python = ">=3.12"
dependencies = [
    "fastapi >= 0.115",
    "uvicorn[standard] >= 0.32",
    "pydantic >= 2.9",
    "pydantic-settings >= 2.6",
    "jinja2 >= 3.1",
    "python-multipart >= 0.0.12",
    "pyyaml >= 6.0",
    "rapidfuzz >= 3.10",
    "pillow >= 11.0",
    "openai >= 1.50",
    "httpx >= 0.27",
    "sse-starlette >= 2.1",
    "paddleocr >= 3.0",
    "paddlepaddle >= 3.0",
    "opencv-python-headless >= 4.10",
    "numpy >= 2.0",
]

[project.optional-dependencies]
gpu = [
    "paddlepaddle-gpu >= 2.6",
    "torch >= 2.5",
]
anthropic = ["anthropic >= 0.39"]

[dependency-groups]
dev = [
    "pytest >= 8.3",
    "pytest-asyncio >= 0.24",
    "taskipy >= 1.13",
    "respx >= 0.21",
]

[tool.taskipy.tasks]
demo = "uvicorn app.main:app --port 8000 --reload"
demo-prod = "uvicorn app.main:app --port 8000"
eval-smoke = "python -m eval.harness --subset smoke"
eval-full = "python -m eval.harness --subset full"
eval-dashboard = "python -m eval.dashboard --history eval/history/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
